training:
  direct:
    - "What is the application closing date?"
    - "How much is the processing fee?"
    - "Where is the student support office?"
    - "What time does the library open?"
    - "How many paid holidays are provided?"
    - "Which email address handles reimbursements?"
    - "When are the semester results published?"
    - "What is the maximum travel allowance?"
    - "How long is the probation period?"
    - "What documents does the application require?"
    - "How many visitors may enter at once?"
    - "What is the standard room deposit?"
    - "When does the enrolment window start?"
    - "What is the emergency contact number?"
    - "Which form contains the employee number?"
    - "What is the minimum course load?"
  policy:
    - "Are employees allowed to carry unused leave forward?"
    - "Can a resident keep a pet in university housing?"
    - "Does the policy allow combining financial awards?"
    - "Are meals covered by the travel allowance?"
    - "Is advance approval necessary for an expensive trip?"
    - "May staff work from another country?"
    - "What restrictions apply to overnight guests?"
    - "Are application fees refundable?"
    - "Is a doctor's certificate required for a long absence?"
    - "Can a student appeal the review outcome?"
    - "Are part-time workers covered by this policy?"
    - "Is the dress code different on weekends?"
    - "Can an award be transferred to another student?"
    - "What rules apply to sharing an access card?"
    - "Are receipts mandatory for small expenses?"
    - "Is business-class travel normally permitted?"
  procedural:
    - "How do I submit a reimbursement request?"
    - "Walk me through applying for housing."
    - "What steps are needed to appeal my grade?"
    - "How can I renew my membership?"
    - "Explain the process for reporting sick leave."
    - "How do I upload proof of payment?"
    - "What should I do after my application is rejected?"
    - "How can a manager approve a schedule?"
    - "Tell me the steps for changing my registered address."
    - "How do I withdraw an existing leave request?"
    - "What is the procedure to replace a lost badge?"
    - "How should I report a maintenance problem?"
    - "How do I correct a mistake on the expense form?"
    - "Explain the registration process for a new course."
    - "How can I request an official transcript?"
    - "What is the process for returning borrowed equipment?"
  eligibility:
    - "I have worked here for eight months; do I qualify for this benefit?"
    - "My grade average is 3.4 and I am in year three; am I eligible?"
    - "Can I receive this grant while holding another award?"
    - "I am part-time and have one year of service; can I apply?"
    - "Do I qualify if my performance rating is below the minimum?"
    - "I work on site and have a high rating; am I allowed to work remotely?"
    - "I missed the application deadline; am I still eligible?"
    - "I am a first-year student with strong grades; do I meet the rules?"
    - "I completed probation yesterday; can I request the allowance?"
    - "Given my income and household size, do I qualify for aid?"
    - "I receive two different awards; may I get a third?"
    - "Does my combination of tenure and role satisfy the policy?"
    - "I have not provided my rating; can you determine my eligibility?"
    - "Would my current course load qualify me for accommodation?"
    - "My claim has no receipt; can it be reimbursed?"
    - "I am a contractor with six months of experience; can I join?"
  comparison:
    - "Compare the two scholarship programmes."
    - "How do single and shared accommodation differ?"
    - "What is the difference between sick and annual leave?"
    - "Which travel option has the lower allowance?"
    - "Compare the requirements for junior and senior staff."
    - "Put the two grant options side by side."
    - "How does remote work compare with flexible hours?"
    - "What benefits are common to both membership tiers?"
    - "Compare the deadlines for the two application rounds."
    - "Which of these housing options includes utilities?"
    - "How do full-time and part-time entitlements differ?"
    - "Compare the fees for an appeal and a recheck."
    - "What changes between standard and premium coverage?"
    - "Contrast the approval rules for domestic and international trips."
    - "Which award covers more of the tuition cost?"
    - "Compare the notice periods for these two requests."
  out_of_scope:
    - "What will the stock market do tomorrow?"
    - "Who won the football match last night?"
    - "Write me a poem about the ocean."
    - "What is the weather forecast for Paris?"
    - "Tell me a joke about penguins."
    - "How do I bake a chocolate cake?"
    - "Which phone should I buy this year?"
    - "What is the current price of gold?"
    - "Translate this song into French."
    - "What are today's international headlines?"
    - "Predict next week's lottery numbers."
    - "Who is the leading actor in this film?"
    - "Design a workout programme for marathon training."
    - "What is the distance from Earth to Mars?"
    - "Recommend a holiday destination for winter."
    - "What was the score in yesterday's cricket game?"
validation:
  direct:
    - "Which day is the final date for enrolment?"
    - "What amount is charged for reviewing one paper?"
    - "How many days of entitlement are listed?"
    - "Where should the completed form be sent?"
  policy:
    - "Are scholarship recipients permitted to stack awards?"
    - "Does a short sick absence need medical evidence?"
    - "What are the rules about guests staying late?"
    - "Are local taxi receipts compulsory?"
  procedural:
    - "Describe each step for requesting a review."
    - "How should a new hire apply for access?"
    - "What do I submit first when claiming expenses?"
    - "How can I cancel a room booking?"
  eligibility:
    - "My tenure is five months and my rating is excellent; can I qualify?"
    - "I hold an athletic award and meet the grade threshold; am I eligible?"
    - "I have the required service but an excluded role; do I meet all conditions?"
    - "With these grades and enrolment details, can I apply for funding?"
  comparison:
    - "Show the differences in the two room packages."
    - "Compare the amounts and requirements of both awards."
    - "Which policy offers a longer notice period?"
    - "How do these leave categories differ in carry-over?"
  out_of_scope:
    - "Suggest a recipe for vegetable soup."
    - "Who is likely to win the next tennis tournament?"
    - "What is the exchange rate at this instant?"
    - "Tell me about the newest cinema releases."
