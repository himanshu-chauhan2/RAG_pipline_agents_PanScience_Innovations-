[project]
name = "knowledge-decision-assistant-backend"
version = "0.1.0"
description = "Multi-tenant, document-grounded knowledge and decision assistant"
requires-python = ">=3.12,<3.13"
dependencies = [
    "bcrypt>=5,<6",
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<1",
    "fastembed>=0.6,<1",
    "numpy>=2,<3",
    "openai>=1.90,<3",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.8,<3",
    "pyjwt>=2.10,<3",
    "pypdf>=5,<7",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.34,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<9",
    "pyyaml>=6,<7",
    "reportlab>=4,<5",
    "ruff>=0.11,<1",
]
