<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>Example partner website</title>
    <style>
      body { max-width: 960px; margin: 3rem auto; padding: 0 1rem; font: 16px/1.6 system-ui, sans-serif; color: #17252b; }
      header { padding: 2rem; background: #ebf5f2; border-radius: 1rem; }
      iframe { width: 100%; height: 620px; border: 1px solid #ccd8d4; border-radius: 1rem; }
      label { display: block; margin: 2rem 0 1rem; font-weight: 600; }
    </style>
  </head>
  <body>
    <header>
      <h1>Example partner website</h1>
      <p>This is an independent page embedding the public document assistant. The sample policies are fictional.</p>
    </header>
    <label for="assistant">Ask about this organisation's policies</label>
    <iframe id="assistant" title="Policy assistant" loading="lazy" referrerpolicy="no-referrer"></iframe>
    <p id="instructions" role="status"></p>
    <script>
      const token = new URLSearchParams(location.search).get("token");
      const instructions = document.getElementById("instructions");
      if (token && /^[A-Za-z0-9_-]{20,128}$/.test(token)) {
        document.getElementById("assistant").src =
          `http://127.0.0.1:5173/a/${encodeURIComponent(token)}`;
      } else {
        instructions.textContent =
          "Add ?token=YOUR_ASSISTANT_TOKEN to this page URL to show your local assistant.";
      }
    </script>
  </body>
</html>
